<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Highland</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: rgba(15, 25, 45, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 28px;
            border: 1px solid rgba(255,215,0,0.4);
        }
        h1 { font-size: 36px; text-align: center; background: linear-gradient(135deg, #ffd700, #ffb347); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
        .sub { text-align: center; color: #8a92b0; margin-bottom: 32px; font-size: 14px; }
        input { width: 100%; padding: 16px 18px; margin: 12px 0; border: none; border-radius: 60px; font-size: 16px; background: rgba(255,255,255,0.95); font-weight: 500; }
        .btn { background: linear-gradient(135deg, #ffd700, #ffb347); color: #0a0f1e; text-align: center; padding: 16px; border-radius: 60px; font-weight: 800; font-size: 18px; border: none; width: 100%; cursor: pointer; margin-top: 16px; }
        .btn:hover { transform: scale(1.02); }
        .otp-section { display: none; margin-top: 20px; }
        .message { text-align: center; margin-top: 20px; color: #ffaa44; font-size: 14px; }
        .back-link { text-align: center; margin-top: 24px; }
        .back-link a { color: #ffd700; text-decoration: none; }
        .recaptcha-note { font-size: 11px; text-align: center; color: #5a6280; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Welcome</h1>
        <div class="sub">Enter your phone to continue</div>
        <div id="phoneSection">
            <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">
            <button class="btn" onclick="sendOTP()">Send OTP</button>
        </div>
        <div id="otpSection" class="otp-section">
            <input type="text" id="otp" placeholder="Enter 6-digit OTP">
            <button class="btn" onclick="verifyOTP()">Verify & Login</button>
        </div>
        <div id="message" class="message"></div>
        <div class="back-link"><a href="index.html">← Back to Home</a></div>
        <div class="recaptcha-note">Protected by reCAPTCHA</div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC9aONpIxib8xv6dO6W0BJSNuvursk3CcI",
            authDomain: "highlandplatform.firebaseapp.com",
            projectId: "highlandplatform",
            storageBucket: "highlandplatform.firebasestorage.app",
            messagingSenderId: "103706215525",
            appId: "1:103706215525:web:a179f9fdd41d3c0399728c"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        let confirmationResult;
        function showMessage(msg, isError = false) {
            const msgDiv = document.getElementById('message');
            msgDiv.innerText = msg;
            msgDiv.style.color = isError ? '#ff6666' : '#ffaa44';
        }
        window.sendOTP = function() {
            const phone = document.getElementById('phone').value;
            if (phone.length !== 10) { showMessage('Enter 10-digit mobile number', true); return; }
            showMessage('Sending OTP...');
            auth.signInWithPhoneNumber('+91' + phone, window.recaptchaVerifier)
                .then((result) => {
                    confirmationResult = result;
                    showMessage('✓ OTP sent! Check your SMS');
                    document.getElementById('phoneSection').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                })
                .catch((error) => { showMessage('Error: ' + error.message, true); });
        };
        window.verifyOTP = function() {
            const otp = document.getElementById('otp').value;
            if (otp.length !== 6) { showMessage('Enter 6-digit OTP', true); return; }
            showMessage('Verifying...');
            confirmationResult.confirm(otp)
                .then(async (result) => {
                    const user = result.user;
                    const phone = user.phoneNumber.slice(3);
                    const urlParams = new URLSearchParams(window.location.search);
                    const referrer = urlParams.get('ref');
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (!userDoc.exists) {
                        await db.collection('users').doc(user.uid).set({
                            phone: phone,
                            name: phone,
                            referralCode: user.uid.slice(0, 8).toUpperCase(),
                            referredBy: referrer || null,
                            isMember: false,
                            walletBalance: 0,
                            totalReferrals: 0,
                            createdAt: new Date()
                        });
                        if (referrer) {
                            const referrerDoc = await db.collection('users').doc(referrer).get();
                            if (referrerDoc.exists) {
                                await db.collection('users').doc(referrer).update({ totalReferrals: firebase.firestore.FieldValue.increment(1) });
                            }
                        }
                        showMessage('Account created! Redirecting...');
                    } else { showMessage('Welcome back! Redirecting...'); }
                    localStorage.setItem('userId', user.uid);
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
                })
                .catch((error) => { showMessage('Wrong OTP: ' + error.message, true); });
        };
        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('phoneSection', { size: 'invisible', callback: () => {} });
    </script>
</body>
</html>
