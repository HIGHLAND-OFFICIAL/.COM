<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Highland Webhook</title></head>
<body style="background:#0a0f1e; color:white; font-family:monospace; padding:20px;">
<h1>🔗 Highland Webhook Receiver</h1>
<p>Status: <span id="status">Waiting for payments...</span></p>
<div id="log"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyC9aONpIxib8xv6dO6W0BJSNuvursk3CcI",
    authDomain: "highlandplatform.firebaseapp.com",
    projectId: "highlandplatform",
    storageBucket: "highlandplatform.firebasestorage.app",
    messagingSenderId: "103706215525",
    appId: "1:103706215525:web:a179f9fdd41d3c0399728c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
function log(msg) { const div = document.getElementById('log'); div.innerHTML += `<p>📝 ${new Date().toLocaleTimeString()}: ${msg}</p>`; console.log(msg); }
async function processPayment(paymentData) {
    try {
        const payment = paymentData.payload.payment.entity;
        const notes = payment.notes || {};
        const amount = payment.amount / 100;
        log(`Processing: ${payment.id} - ₹${amount}`);
        const paymentRecord = {
            paymentId: payment.id,
            amount: amount,
            customerName: notes.name || 'Unknown',
            customerPhone: notes.phone || '',
            referredBy: notes.referred_by || '',
            referrerId: notes.referred_by || null,
            commission: 0,
            type: 'access',
            createdAt: new Date()
        };
        if (paymentRecord.referredBy && paymentRecord.referredBy !== '') {
            paymentRecord.commission = amount * 0.8;
            const referrerRef = db.collection('users').doc(paymentRecord.referredBy);
            const referrer = await referrerRef.get();
            if (referrer.exists) {
                await referrerRef.update({ walletBalance: firebase.firestore.FieldValue.increment(paymentRecord.commission) });
                log(`✅ Added ₹${paymentRecord.commission} to ${paymentRecord.referredBy}'s wallet`);
            } else { log(`⚠️ Referrer ${paymentRecord.referredBy} not found`); }
        }
        await db.collection('payments').add(paymentRecord);
        if (paymentRecord.referredBy) {
            await db.collection('users').doc(paymentRecord.referredBy).update({ totalReferrals: firebase.firestore.FieldValue.increment(1) });
        }
        log(`💾 Saved payment to database`);
        document.getElementById('status').innerHTML = '✅ Payment processed!';
    } catch(e) { log(`❌ Error: ${e.message}`); document.getElementById('status').innerHTML = '❌ Error'; }
}
async function handleWebhook() {
    log('Webhook ready');
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('test') === '1') {
        log('🧪 TEST MODE');
        await processPayment({ payload: { payment: { entity: { id: 'test', amount: 50000, notes: { referred_by: 'TEST', name: 'Test', phone: '9999999999' } } } } });
    } else { log('📡 Waiting for Razorpay webhook...'); }
}
handleWebhook();
</script>
</body>
</html>
