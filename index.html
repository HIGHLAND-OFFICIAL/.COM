<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highland Jobs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
font-family:system-ui;
background:#0f172a;
color:white;
padding:20px;
}
.container{max-width:450px;margin:auto;}
.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-bottom:20px;
}
input{
width:100%;
padding:12px;
margin:5px 0;
border-radius:10px;
border:none;
}
button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#ff8c42;
color:white;
font-weight:bold;
margin-top:10px;
}
.hidden{display:none;}
.wallet{font-size:40px;text-align:center;color:#ffb347;}
.link{background:#020617;padding:10px;border-radius:10px;font-size:12px;word-break:break-all;}
</style>
</head>

<body>
<div class="container">

<div id="home" class="card">
<h1>HIGHLAND JOBS</h1>
<p>Earn ₹400 per referral</p>
<button onclick="showAuth()">Start Now</button>
</div>

<div id="auth" class="card hidden">
<h3>Login</h3>
<input id="loginPhone" placeholder="Phone">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>

<hr>

<h3>Signup</h3>
<input id="signPhone" placeholder="Phone">
<input id="signPass" type="password" placeholder="Password">
<input id="coupon" placeholder="Coupon (optional)">
<button onclick="signup()">Signup</button>

<button onclick="back()">Back</button>
<p id="msg"></p>
</div>

<div id="dash" class="hidden">

<div class="card">
<div class="wallet" id="wallet">₹0</div>
<div id="memberStatus"></div>
</div>

<div class="card">
<h3>Your Referral Link</h3>
<div class="link" id="refLink"></div>
<button onclick="copy()">Copy</button>
<button onclick="whatsapp()">WhatsApp</button>
</div>

<div class="card">
<button id="upgradeBtn">Upgrade ₹500</button>
<button onclick="withdraw()">Withdraw</button>
<button onclick="logout()">Logout</button>
</div>

</div>

</div>

<script>
const supabase = window.supabase.createClient(
"https://hwezthfuxgtlhyyofrsa.supabase.co",
"sb_publishable_slq94VMSpehkdCFoA4PXOw_bgcChKgC"
);

let userId = localStorage.getItem("userId");

function showAuth(){
home.classList.add("hidden");
auth.classList.remove("hidden");
}
function back(){
auth.classList.add("hidden");
home.classList.remove("hidden");
}

async function signup(){
let phone=signPhone.value;
let pass=signPass.value;
let cp=coupon.value;

if(phone.length!=10){msg.innerText="Invalid phone";return;}
if(pass.length<4){msg.innerText="Password min 4";return;}

let isMember=false;

if(cp){
let {data}=await supabase.from("coupons").select("*").eq("code",cp).single();
if(data && data.used_count < data.max_use){
isMember=true;
await supabase.from("coupons").update({used_count:data.used_count+1}).eq("code",cp);
}else{
msg.innerText="Invalid coupon";return;
}
}

let ref=new URLSearchParams(location.search).get("ref");

let {data:newUser,error}=await supabase.from("users").insert({
phone:phone,
password:pass,
is_member:isMember,
referred_by:ref
}).select().single();

if(error){msg.innerText=error.message;return;}

if(ref && isMember){
let {data:r}=await supabase.from("users").select("*").eq("id",ref).single();
if(r && r.is_member){
await supabase.from("users").update({
wallet_balance:r.wallet_balance+400,
total_referrals:r.total_referrals+1
}).eq("id",ref);

await supabase.from("payments").insert({
user_id:ref,
amount:400,
type:"referral"
});
}
}

localStorage.setItem("userId",newUser.id);
userId=newUser.id;
loadDash();
}

async function login(){
let {data}=await supabase.from("users").select("*")
.eq("phone",loginPhone.value).single();

if(!data){msg.innerText="User not found";return;}
if(data.password!=loginPass.value){msg.innerText="Wrong password";return;}

localStorage.setItem("userId",data.id);
userId=data.id;
loadDash();
}

async function loadDash(){
home.classList.add("hidden");
auth.classList.add("hidden");
dash.classList.remove("hidden");

let {data}=await supabase.from("users").select("*").eq("id",userId).single();

wallet.innerText="₹"+data.wallet_balance;
refLink.innerText=location.origin+"?ref="+data.id;

if(data.is_member){
memberStatus.innerText="Active Member";
upgradeBtn.style.display="none";
}else{
memberStatus.innerText="Not Member";
upgradeBtn.onclick=()=>{
localStorage.setItem("pending_member",userId);
window.location.href="https://rzp.io/rzp/XhvqGQZ";
}
}
}

function copy(){
navigator.clipboard.writeText(refLink.innerText);
alert("Copied");
}
function whatsapp(){
window.open("https://wa.me/?text=Join and earn ₹400 "+refLink.innerText);
}

async function withdraw(){
let {data}=await supabase.from("users").select("*").eq("id",userId).single();
if(!data.is_member){alert("Only members");return;}
if(data.wallet_balance<100){alert("Min ₹100");return;}

let upi=prompt("Enter UPI");
if(!upi)return;

await supabase.from("withdrawals").insert({
user_id:userId,
amount:data.wallet_balance,
upi_id:upi
});
await supabase.from("users").update({wallet_balance:0}).eq("id",userId);
alert("Requested");
loadDash();
}

function logout(){
localStorage.removeItem("userId");
location.reload();
}

if(userId) loadDash();
</script>
</body>
</html>
