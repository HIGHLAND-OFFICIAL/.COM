<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Highland | Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #0f0;
            padding: 20px;
        }
        .card {
            background: #111;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            border: 1px solid #0f0;
        }
        .error { color: #f00; background: #200; padding: 10px; margin: 10px 0; }
        .success { color: #0f0; }
        button {
            background: #0f0;
            color: #000;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            border-radius: 8px;
            font-size: 16px;
        }
        .hidden { display: none; }
        #log {
            background: #1a1a1a;
            padding: 10px;
            height: 300px;
            overflow-y: scroll;
            font-size: 12px;
            border-radius: 8px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0/dist/iife/sdk.min.js"></script>
</head>
<body>
    <div class="card">
        <h1>🐛 HIGHLAND DEBUG</h1>
        <p>Testing Appwrite v14 Phone Auth</p>
    </div>

    <div class="card">
        <h3>📋 Status</h3>
        <div id="statusDiv">Initializing...</div>
    </div>

    <div class="card">
        <h3>📱 Test Phone OTP</h3>
        <input type="tel" id="phone" placeholder="10-digit mobile number">
        <button id="sendBtn">Send OTP</button>
        <div id="otpDiv" class="hidden">
            <input type="text" id="otpCode" placeholder="6-digit OTP">
            <button id="verifyBtn">Verify OTP</button>
        </div>
        <div id="result"></div>
    </div>

    <div class="card">
        <h3>📜 Log</h3>
        <div id="log"></div>
    </div>

    <script>
        const statusDiv = document.getElementById('statusDiv');
        const logDiv = document.getElementById('log');
        const resultDiv = document.getElementById('result');
        const phoneInput = document.getElementById('phone');
        const otpDiv = document.getElementById('otpDiv');
        const otpInput = document.getElementById('otpCode');

        function addLog(msg, isError = false) {
            const entry = document.createElement('div');
            entry.style.color = isError ? '#f00' : '#0f0';
            entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(entry);
            entry.scrollIntoView();
            console.log(msg);
        }

        function showStatus(msg, isError = false) {
            statusDiv.innerHTML = msg;
            statusDiv.style.color = isError ? '#f00' : '#0f0';
            addLog(msg, isError);
        }

        // Appwrite config
        const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1';
        const APPWRITE_PROJECT_ID = '69c74d8a001174da7635';

        let client, account;
        let currentSession = null;
        let isReady = false;

        // List all available methods on account object
        function listMethods(obj) {
            let methods = [];
            for (let key in obj) {
                if (typeof obj[key] === 'function') {
                    methods.push(key);
                }
            }
            addLog('📋 Available methods: ' + methods.join(', '));
            return methods;
        }

        // Initialize Appwrite
        function init() {
            addLog('Initializing Appwrite...');
            if (typeof Appwrite === 'undefined') {
                addLog('❌ Appwrite SDK not loaded! Retrying...', true);
                setTimeout(init, 500);
                return;
            }
            addLog('✅ Appwrite SDK loaded', false);
            
            try {
                client = new Appwrite.Client();
                client.setEndpoint(APPWRITE_ENDPOINT);
                client.setProject(APPWRITE_PROJECT_ID);
                addLog('✅ Client created', false);
                
                account = new Appwrite.Account(client);
                addLog('✅ Account created', false);
                
                // List all available methods
                listMethods(account);
                
                isReady = true;
                showStatus('✅ Ready! Enter phone number');
            } catch (e) {
                addLog('❌ Init error: ' + e.message, true);
                showStatus('❌ Error: ' + e.message, true);
            }
        }

        // Send OTP - Try different method names
        async function sendOTP() {
            if (!isReady) {
                resultDiv.innerHTML = '<span class="error">❌ Appwrite not ready</span>';
                return;
            }
            const phone = phoneInput.value;
            if (phone.length !== 10) {
                resultDiv.innerHTML = '<span class="error">❌ Enter 10 digits</span>';
                return;
            }
            resultDiv.innerHTML = '<span class="success">📤 Sending OTP...</span>';
            addLog(`Sending OTP to +91${phone}`);
            
            // Try different method names that might work
            const methodsToTry = [
                { name: 'createPhoneSession', params: ['+91' + phone] },
                { name: 'createPhoneVerification', params: ['+91' + phone] },
                { name: 'createSession', params: ['+91' + phone, 'phone'] },
                { name: 'sendPhoneVerification', params: ['+91' + phone] }
            ];
            
            for (let method of methodsToTry) {
                if (typeof account[method.name] === 'function') {
                    addLog(`Trying: ${method.name}...`);
                    try {
                        const result = await account[method.name](...method.params);
                        addLog(`✅ Success with ${method.name}!`);
                        currentSession = result;
                        resultDiv.innerHTML = '<span class="success">✅ OTP sent! Check SMS</span>';
                        otpDiv.classList.remove('hidden');
                        return;
                    } catch (e) {
                        addLog(`❌ ${method.name} failed: ${e.message}`, true);
                    }
                } else {
                    addLog(`⚠️ ${method.name} not available`, true);
                }
            }
            
            resultDiv.innerHTML = '<span class="error">❌ No working phone auth method found. Check Appwrite docs.</span>';
            addLog('❌ All phone auth methods failed', true);
        }

        // Verify OTP
        async function verifyOTP() {
            const otp = otpInput.value;
            if (otp.length !== 6) {
                resultDiv.innerHTML = '<span class="error">❌ Enter 6-digit OTP</span>';
                return;
            }
            resultDiv.innerHTML = '<span class="success">🔐 Verifying...</span>';
            addLog(`Verifying OTP: ${otp}`);
            
            // Try different verify methods
            const verifyMethods = [
                { name: 'updatePhoneSession', params: [currentSession.$id, otp] },
                { name: 'updatePhoneVerification', params: [currentSession.$id, otp] },
                { name: 'createSession', params: ['+91' + phoneInput.value, otp, 'phone'] }
            ];
            
            for (let method of verifyMethods) {
                if (typeof account[method.name] === 'function') {
                    try {
                        const session = await account[method.name](...method.params);
                        addLog(`✅ Verified with ${method.name}! User ID: ${session.userId}`);
                        resultDiv.innerHTML = '<span class="success">✅ Login successful!</span>';
                        setTimeout(() => {
                            window.location.href = 'https://highland-official.github.io/.COM/';
                        }, 1500);
                        return;
                    } catch (e) {
                        addLog(`❌ ${method.name} failed: ${e.message}`, true);
                    }
                }
            }
            
            resultDiv.innerHTML = '<span class="error">❌ Verification failed. Check Appwrite docs.</span>';
        }

        // Event listeners
        document.getElementById('sendBtn').onclick = sendOTP;
        document.getElementById('verifyBtn').onclick = verifyOTP;

        // Start
        init();
    </script>
</body>
</html>
