<!DOCTYPE html>
<html>
<head>
  <title>Supabase OTP Debug</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 14px;
      margin: 8px;
      width: 90%;
      max-width: 320px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button { background: #22c55e; color: white; font-weight: bold; }
    #log {
      margin-top: 20px;
      text-align: left;
      background: black;
      padding: 10px;
      font-size: 12px;
      height: 250px;
      overflow-y: scroll;
      white-space: pre-wrap;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h2>Supabase OTP Debug</h2>

<input id="phone" placeholder="Phone 919876543210">
<button id="sendBtn" type="button">Send OTP</button>

<input id="otp" placeholder="Enter OTP">
<button id="verifyBtn" type="button">Verify OTP</button>

<div id="log"></div>

<script>
function log(msg) {
  const logBox = document.getElementById("log");
  logBox.innerText += msg + "\\n";
  console.log(msg);
}

window.onerror = function(message, source, lineno, colno, error) {
  log("JS ERROR: " + message + " at line " + lineno);
};

document.addEventListener("DOMContentLoaded", function() {

  log("Page Loaded");

  if (!window.supabase) {
    log("ERROR: Supabase library NOT loaded");
    return;
  } else {
    log("Supabase library loaded");
  }

  const supabaseUrl = "https://hwezthfuxgtlhyyofrsa.supabase.co";
  const supabaseKey = "PASTE_YOUR_ANON_KEY";
  const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

  log("Supabase client created");

  document.getElementById("sendBtn").addEventListener("click", async () => {
    log("Send OTP button clicked");

    const phone = document.getElementById("phone").value;
    if (!phone) {
      log("ERROR: Phone number empty");
      return;
    }

    log("Sending OTP to +" + phone);

    try {
      const { data, error } = await supabase.auth.signInWithOtp({
        phone: "+" + phone
      });

      if (error) {
        log("Supabase Error: " + error.message);
      } else {
        log("OTP request sent successfully");
        log(JSON.stringify(data));
      }
    } catch (err) {
      log("NETWORK ERROR: " + err.message);
    }
  });

  document.getElementById("verifyBtn").addEventListener("click", async () => {
    log("Verify button clicked");

    const phone = document.getElementById("phone").value;
    const otp = document.getElementById("otp").value;

    if (!otp) {
      log("ERROR: OTP empty");
      return;
    }

    try {
      const { data, error } = await supabase.auth.verifyOtp({
        phone: "+" + phone,
        token: otp,
        type: "sms"
      });

      if (error) {
        log("Verify Error: " + error.message);
      } else {
        log("Login Success");
        log("User ID: " + data.user.id);

        // Insert user into table
        const { error: dbError } = await supabase
          .from("users")
          .insert([{ id: data.user.id, phone: data.user.phone }]);

        if (dbError) {
          log("DB Error: " + dbError.message);
        } else {
          log("User inserted into database");
        }
      }
    } catch (err) {
      log("Verify Network Error: " + err.message);
    }
  });

});
</script>

</body>
</html>
