<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highland | Debug Mode</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #00ff00;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card {
            background: #111;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #00ff00;
        }
        .error { color: #ff4444; background: #220000; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .success { color: #00ff00; }
        .info { color: #ffaa00; }
        button {
            background: #00ff00;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
            font-weight: bold;
        }
        input {
            background: #222;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            border-radius: 8px;
        }
        pre { white-space: pre-wrap; word-break: break-all; }
        #log { height: 300px; overflow-y: scroll; background: #1a1a1a; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🐛 HIGHLAND DEBUG MODE</h1>
            <p>Testing Appwrite connection with fallback CDNs</p>
        </div>

        <div class="card">
            <h3>📋 Status Log</h3>
            <div id="log"></div>
        </div>

        <div class="card">
            <h3>🔧 Test Actions</h3>
            <button id="testAppwriteBtn">Test Appwrite Connection</button>
            <button id="testPhoneBtn">Test Phone OTP</button>
            <button id="clearLogBtn">Clear Log</button>
        </div>

        <div class="card">
            <h3>📱 Phone Test</h3>
            <input type="tel" id="phoneInput" placeholder="10-digit mobile">
            <button id="sendTestOtpBtn">Send Test OTP</button>
            <div id="otpResult" style="margin-top: 10px;"></div>
        </div>
    </div>

    <!-- Appwrite SDK - Multiple CDN attempts -->
    <script>
        // Try multiple CDNs
        const cdnUrls = [
            'https://cdn.jsdelivr.net/npm/appwrite@14.0.0/dist/umd/sdk.min.js',
            'https://unpkg.com/appwrite@14.0.0/dist/umd/sdk.min.js',
            'https://cdn.skypack.dev/appwrite@14.0.0'
        ];
        
        let currentCdnIndex = 0;
        
        function loadAppwrite() {
            addLog(`📡 Attempting to load Appwrite from: ${cdnUrls[currentCdnIndex]}`);
            const script = document.createElement('script');
            script.src = cdnUrls[currentCdnIndex];
            script.onload = () => {
                addLog('✅ Appwrite SDK loaded successfully!', 'success');
                window.AppwriteLoaded = true;
            };
            script.onerror = () => {
                addLog(`❌ Failed to load from ${cdnUrls[currentCdnIndex]}`, 'error');
                currentCdnIndex++;
                if (currentCdnIndex < cdnUrls.length) {
                    loadAppwrite();
                } else {
                    addLog('❌ All CDNs failed. Check internet connection.', 'error');
                }
            };
            document.head.appendChild(script);
        }
        
        loadAppwrite();
    </script>

    <script>
        // Debug log function
        const logDiv = document.getElementById('log');
        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff4444' : (type === 'success' ? '#00ff00' : '#ffaa00');
            entry.innerHTML = `<span style="color:#888;">[${timestamp}]</span> <span style="color:${color};">${msg}</span>`;
            logDiv.appendChild(entry);
            entry.scrollIntoView();
            console.log(msg);
        }

        function clearLog() {
            logDiv.innerHTML = '';
            addLog('Log cleared');
        }

        // Appwrite config
        const APPWRITE_ENDPOINT = 'https://cloud.appwrite.io/v1';
        const APPWRITE_PROJECT_ID = '69c74d8a001174da7635';
        const APPWRITE_DATABASE_ID = 'highland_db';

        let client = null;
        let account = null;
        let databases = null;

        // Test Appwrite connection
        async function testAppwrite() {
            addLog('🔄 Testing Appwrite connection...');
            
            if (!window.Appwrite && !window.AppwriteLoaded) {
                addLog('❌ Appwrite SDK still not loaded. Waiting...', 'error');
                addLog('💡 Try refreshing the page or check your internet.', 'info');
                return;
            }
            
            await new Promise(r => setTimeout(r, 500)); // Small delay for SDK to initialize
            
            if (typeof Appwrite === 'undefined') {
                addLog('❌ Appwrite SDK not available. Retry in a moment.', 'error');
                return;
            }
            
            addLog('✅ Appwrite SDK detected', 'success');

            try {
                client = new Appwrite.Client();
                client.setEndpoint(APPWRITE_ENDPOINT);
                client.setProject(APPWRITE_PROJECT_ID);
                addLog(`✅ Client created with endpoint: ${APPWRITE_ENDPOINT}`, 'success');
                
                account = new Appwrite.Account(client);
                databases = new Appwrite.Databases(client);
                addLog('✅ Account and Databases created', 'success');

                // Try to get current session
                try {
                    const session = await account.getSession('current');
                    addLog(`✅ Session found! User ID: ${session.userId}`, 'success');
                } catch (e) {
                    addLog(`ℹ️ No active session: ${e.message}`, 'info');
                }

                // Test database connection
                try {
                    const db = await databases.get(APPWRITE_DATABASE_ID);
                    addLog(`✅ Database found: ${db.name}`, 'success');
                } catch (e) {
                    addLog(`❌ Database error: ${e.message}`, 'error');
                    addLog(`   Make sure database '${APPWRITE_DATABASE_ID}' exists`, 'error');
                }

                addLog('🎉 Appwrite connection test complete!', 'success');
            } catch (e) {
                addLog(`❌ Fatal error: ${e.message}`, 'error');
                console.error(e);
            }
        }

        // Test phone OTP
        let currentSession = null;
        async function testPhoneOTP() {
            const phone = document.getElementById('phoneInput').value;
            const resultDiv = document.getElementById('otpResult');
            
            if (!phone || phone.length !== 10) {
                resultDiv.innerHTML = '<span style="color:#ff4444;">❌ Enter 10-digit phone number</span>';
                return;
            }

            if (!account) {
                resultDiv.innerHTML = '<span style="color:#ff4444;">❌ Appwrite not initialized. Click "Test Appwrite Connection" first.</span>';
                return;
            }

            resultDiv.innerHTML = '<span style="color:#ffaa00;">📤 Sending OTP...</span>';
            addLog(`📱 Attempting to send OTP to +91${phone}`);

            try {
                currentSession = await account.createPhoneSession('+91' + phone);
                resultDiv.innerHTML = '<span style="color:#00ff00;">✅ OTP sent! Check your SMS. Enter code below.</span>';
                addLog(`✅ OTP session created: ${currentSession.$id}`, 'success');
                
                // Show OTP input
                resultDiv.innerHTML += '<br><input type="text" id="otpCodeInput" placeholder="Enter 6-digit OTP" style="width:100%; padding:10px; margin:10px 0;"><button id="verifyOtpBtn">Verify OTP</button>';
                
                document.getElementById('verifyOtpBtn').onclick = async () => {
                    const otp = document.getElementById('otpCodeInput').value;
                    if (!otp || otp.length !== 6) {
                        resultDiv.innerHTML = '<span style="color:#ff4444;">❌ Enter 6-digit OTP</span>';
                        return;
                    }
                    resultDiv.innerHTML = '<span style="color:#ffaa00;">🔐 Verifying...</span>';
                    try {
                        const session = await account.updatePhoneSession(currentSession.$id, otp);
                        resultDiv.innerHTML = `<span style="color:#00ff00;">✅ Verified! User ID: ${session.userId}</span>`;
                        addLog(`✅ OTP verified! User ID: ${session.userId}`, 'success');
                    } catch (e) {
                        resultDiv.innerHTML = `<span style="color:#ff4444;">❌ Wrong OTP: ${e.message}</span>`;
                        addLog(`❌ OTP verification failed: ${e.message}`, 'error');
                    }
                };
            } catch (e) {
                resultDiv.innerHTML = `<span style="color:#ff4444;">❌ Error: ${e.message}</span>`;
                addLog(`❌ OTP send failed: ${e.message}`, 'error');
            }
        }

        // Event listeners
        document.getElementById('testAppwriteBtn').onclick = testAppwrite;
        document.getElementById('testPhoneBtn').onclick = testPhoneOTP;
        document.getElementById('sendTestOtpBtn').onclick = testPhoneOTP;
        document.getElementById('clearLogBtn').onclick = clearLog;

        // Auto-run on page load
        addLog('🐛 Debug mode started');
        addLog(`📡 Project ID: ${APPWRITE_PROJECT_ID}`);
        addLog(`🗄️ Database ID: ${APPWRITE_DATABASE_ID}`);
        addLog('💡 Waiting for Appwrite SDK to load...');
        
        // Check for SDK load
        let checkCount = 0;
        const interval = setInterval(() => {
            if (window.AppwriteLoaded || typeof Appwrite !== 'undefined') {
                addLog('✅ Appwrite SDK ready! Click "Test Appwrite Connection"', 'success');
                clearInterval(interval);
            }
            checkCount++;
            if (checkCount > 20) {
                addLog('⚠️ SDK taking too long to load. Try refreshing.', 'error');
                clearInterval(interval);
            }
        }, 500);
    </script>
</body>
</html>
