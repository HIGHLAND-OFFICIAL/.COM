<!DOCTYPE html>
<html>
<head>
    <title>Appwrite Test</title>
</head>
<body>
    <h1>Testing Appwrite SDK</h1>
    <div id="status">Loading...</div>

    <!-- CORRECT Appwrite SDK URL -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0/dist/iife/sdk.min.js"></script>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        setTimeout(() => {
            if (typeof Appwrite !== 'undefined') {
                statusDiv.innerHTML = '✅ SUCCESS: Appwrite SDK loaded!';
                statusDiv.style.color = 'green';
            } else {
                statusDiv.innerHTML = '❌ FAILED: Appwrite SDK not loaded.';
                statusDiv.style.color = 'red';
            }
        }, 2000);
    </script>
</body>
</html>
