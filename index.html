<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highland SMS Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fb;
            padding: 20px;
        }
        .container { max-width: 400px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .btn {
            background: #1e3a5f;
            color: white;
            padding: 14px;
            border-radius: 60px;
            width: 100%;
            border: none;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            cursor: pointer;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 60px;
            font-size: 16px;
            margin: 10px 0;
        }
        .hidden { display: none; }
        .success { color: green; margin: 10px 0; }
        .error { color: red; margin: 10px 0; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📱 Highland SMS Test</h1>
            <p>Enter your phone to receive OTP</p>
            
            <div id="step1">
                <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">
                <button class="btn" id="sendBtn">Send OTP</button>
            </div>
            
            <div id="step2" class="hidden">
                <input type="text" id="otp" placeholder="6-digit OTP">
                <button class="btn" id="verifyBtn">Verify OTP</button>
            </div>
            
            <div id="message"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hwezthfuxgtlhyyofrsa.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_slq94VMSpehkdCFoA4PXOw_bgcChKgC';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let phoneNumber = '';
        
        document.getElementById('sendBtn').onclick = async () => {
            const phone = document.getElementById('phone').value;
            if (phone.length !== 10) {
                document.getElementById('message').innerHTML = '<p class="error">❌ Enter 10 digits</p>';
                return;
            }
            
            phoneNumber = phone;
            document.getElementById('message').innerHTML = '<p class="success">📤 Sending OTP...</p>';
            
            const { error } = await supabase.auth.signInWithOtp({
                phone: '+91' + phone
            });
            
            if (error) {
                document.getElementById('message').innerHTML = '<p class="error">❌ Error: ' + error.message + '</p>';
            } else {
                document.getElementById('message').innerHTML = '<p class="success">✅ OTP sent! Check your SMS.</p>';
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            }
        };
        
        document.getElementById('verifyBtn').onclick = async () => {
            const otp = document.getElementById('otp').value;
            if (otp.length !== 6) {
                document.getElementById('message').innerHTML = '<p class="error">❌ Enter 6-digit OTP</p>';
                return;
            }
            
            document.getElementById('message').innerHTML = '<p class="success">🔐 Verifying...</p>';
            
            const { data, error } = await supabase.auth.verifyOtp({
                phone: '+91' + phoneNumber,
                token: otp,
                type: 'sms'
            });
            
            if (error) {
                document.getElementById('message').innerHTML = '<p class="error">❌ Wrong OTP: ' + error.message + '</p>';
            } else {
                document.getElementById('message').innerHTML = '<p class="success">✅ SUCCESS! You are logged in. User ID: ' + data.user.id + '</p>';
                document.getElementById('step2').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
